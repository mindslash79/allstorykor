name: Materialize RPG Maker web data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-web-data.yml'
      - 'recovery/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Map001 and Tilesets as normal JSON files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');

          function read(path) {
            return fs.readFileSync(path, 'utf8').trim();
          }

          // The first Map001 recovery segment contains a long ER repetition.
          // Reconstruct that repetitive section deterministically to avoid copy/transmission drift.
          const mapPart1 =
            read('recovery/Map001.part1a.b64') +
            ('g2Xhvvjhkt7cX/2ZvOB8ufszt6M79T' + 'RE'.repeat(234) + 'R') +
            ('ER'.repeat(161) + 'E' + 'ZGWJQIAAKB0tx/cu3/1f88/cvI/l/4eSl+KheM4Et3Yv2IWyYqd7+oueG1JrTyFFV8x9sRDr/PYr4rNs7xU/xWr/wmsKfNjkmq6TpbiErkZk+pyt+mXU12fsH7d1HIzsKyjmHiDKeO6WL1XG8IQg9iUS7s1N7GNV6pzvdiC6MNlXNkjl') +
            read('recovery/Map001.part1d.b64');

          if (mapPart1.length !== 1996) {
            throw new Error(`Map001 first segment mismatch: ${mapPart1.length} != 1996`);
          }

          const payloads = {
            'Map001.json': mapPart1 + read('recovery/Map001.part2.b64') + read('recovery/Map001.part3.b64') + read('recovery/Map001.part4.b64'),
            'Tilesets.json': read('recovery/Tilesets.part1.b64') + read('recovery/Tilesets.part2.b64')
          };

          const expected = {
            'Map001.json': { base64: 7984, json: 986362 },
            'Tilesets.json': { base64: 3632, json: 246734 }
          };

          for (const name of Object.keys(payloads)) {
            const packed = payloads[name];
            if (packed.length !== expected[name].base64) {
              throw new Error(`${name} base64 length mismatch: ${packed.length} != ${expected[name].base64}`);
            }
            const text = zlib.gunzipSync(Buffer.from(packed, 'base64')).toString('utf8');
            if (Buffer.byteLength(text) !== expected[name].json) {
              throw new Error(`${name} JSON size mismatch: ${Buffer.byteLength(text)} != ${expected[name].json}`);
            }
            JSON.parse(text);
            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync(`data/${name}`, text);
            console.log(`Restored data/${name}: ${Buffer.byteLength(text)} bytes`);
          }

          const indexPath = 'index.html';
          let html = fs.readFileSync(indexPath, 'utf8');
          html = html.replace(/^.*allstory_embedded_data\.js.*\r?\n/m, '');
          if (html.includes('allstory_embedded_data.js')) {
            throw new Error('Failed to remove embedded-data bridge from index.html');
          }
          fs.writeFileSync(indexPath, html);
          NODE

      - name: Verify restored files
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('data/Map001.json','utf8')); JSON.parse(require('fs').readFileSync('data/Tilesets.json','utf8'));"
          grep -q 'allstory_embedded_data.js' index.html && exit 1 || true
          test -s data/Map001.json
          test -s data/Tilesets.json

      - name: Commit materialized web data
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "allstory-web-fix"
          git config user.email "actions@users.noreply.github.com"
          git add data/Map001.json data/Tilesets.json index.html
          git commit -m "Fix mobile data loading without browser gzip"
          git push
