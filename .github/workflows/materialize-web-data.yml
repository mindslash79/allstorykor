name: Materialize RPG Maker web data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-web-data.yml'
      - 'recovery/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Map001 and Tilesets as normal JSON files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');

          const configs = [
            { name: 'Map001.json', parts: 4, expectedBase64: 7984, expectedJson: 986362 },
            { name: 'Tilesets.json', parts: 2, expectedBase64: 3632, expectedJson: 246734 }
          ];

          for (const cfg of configs) {
            const stem = cfg.name.replace('.json', '');
            let packed = '';
            for (let i = 1; i <= cfg.parts; i++) {
              packed += fs.readFileSync(`recovery/${stem}.part${i}.b64`, 'utf8').trim();
            }
            if (packed.length !== cfg.expectedBase64) {
              throw new Error(`${cfg.name} base64 length mismatch: ${packed.length} != ${cfg.expectedBase64}`);
            }
            const raw = Buffer.from(packed, 'base64');
            const text = zlib.gunzipSync(raw).toString('utf8');
            if (Buffer.byteLength(text) !== cfg.expectedJson) {
              throw new Error(`${cfg.name} JSON size mismatch: ${Buffer.byteLength(text)} != ${cfg.expectedJson}`);
            }
            JSON.parse(text);
            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync(`data/${cfg.name}`, text);
            console.log(`Restored data/${cfg.name}: ${Buffer.byteLength(text)} bytes`);
          }

          const indexPath = 'index.html';
          let html = fs.readFileSync(indexPath, 'utf8');
          html = html.replace(/^.*allstory_embedded_data\.js.*\r?\n/m, '');
          if (html.includes('allstory_embedded_data.js')) {
            throw new Error('Failed to remove embedded-data bridge from index.html');
          }
          fs.writeFileSync(indexPath, html);
          NODE

      - name: Verify restored files
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('data/Map001.json','utf8')); JSON.parse(require('fs').readFileSync('data/Tilesets.json','utf8'));"
          grep -q 'allstory_embedded_data.js' index.html && exit 1 || true
          test -s data/Map001.json
          test -s data/Tilesets.json

      - name: Commit materialized web data
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "allstory-web-fix"
          git config user.email "actions@users.noreply.github.com"
          git add data/Map001.json data/Tilesets.json index.html
          git commit -m "Fix mobile data loading without browser gzip"
          git push
