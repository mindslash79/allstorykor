name: Fix opening playback synchronization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-opening-playback-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-opening-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make movie and music start together
        env:
          REPLACEMENT_B64: >-
            
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('js/main.js')
          text = path.read_text(encoding='utf-8')
          start_marker = '    function startOpening() {'
          end_marker = '};\n\nwindow.onload = function() {'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the opening playback block in js/main.js')
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode('utf-8')
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Commit the fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js
          if git diff --cached --quiet; then
            echo "No change needed"
            exit 0
          fi
          git commit -m "Keep opening movie and music synchronized"
          git push
